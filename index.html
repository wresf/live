<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Unified Drive Explorer</title>
<script src="https://accounts.google.com/gsi/client"></script>
<style>
  * { box-sizing: border-box; }
  body { font-family: Arial, sans-serif; margin: 0; display: flex; height: 100vh; }
  #sidebar { width: 260px; background: #f4f4f4; padding: 15px; overflow-y: auto; }
  #main { flex: 1; display: flex; flex-direction: column; }
  #toolbar { padding: 10px; background: #2c3e50; }
  #toolbar button { margin-right: 6px; padding: 6px 12px; cursor: pointer; }
  #breadcrumb { padding: 8px 10px; background: #ecf0f1; font-size: 14px; }
  #sortBar { padding: 6px 10px; background: #ecf0f1; font-size: 13px; border-top: 1px solid #ddd; }
  #fileGrid { flex: 1; overflow-y: auto; padding: 10px; }
  .account { padding: 6px; margin-bottom: 6px; background: #fff; border-radius: 4px; font-size: 13px; cursor: pointer; }
  .account:hover { background: #eaf2f8; }
  .storage-bar { width: 100%; height: 8px; background: #ecf0f1; border-radius: 4px; overflow: hidden; margin-top: 6px; }
  .storage-fill { height: 100%; transition: width 0.3s; }
  .storage-safe { background: #2ecc71; }
  .storage-warning { background: #f1c40f; }
  .storage-danger { background: #e74c3c; }
  table.explorer { width: 100%; border-collapse: collapse; }
  table.explorer th { cursor: pointer; text-align: left; padding: 8px; background: #34495e; color: white; user-select: none; position: sticky; top: 0; }
  table.explorer td { padding: 6px 8px; border-bottom: 1px solid #eee; font-size: 13px; }
  table.explorer tr:hover { background: #f5f5f5; }
  table.explorer tr.selected { background: #d4e6f1; }
  @media (max-width: 700px) {
    body { flex-direction: column; }
    #sidebar { width: 100%; height: auto; max-height: 160px; }
    #main { height: calc(100vh - 160px); }
  }
</style>
</head>
<body>

<div id="sidebar">
  <h3>Akun Terhubung</h3>
  <div id="accountList"></div>
  <button onclick="tambahAkun()" style="width:100%; padding:8px; margin-top:8px;">+ Tambah Akun</button>
  <hr>
  <h4>Total Kapasitas Gabungan</h4>
  <div id="storageSummary">Belum ada akun ditambahkan</div>
</div>

<div id="main">
  <div id="toolbar">
    <button onclick="buatFolder()">Folder Baru</button>
    <button onclick="uploadFileTrigger()">Upload</button>
    <input type="file" id="fileInput" style="display:none" onchange="uploadFile(event)">
    <button onclick="salinItem()">Copy</button>
    <button onclick="potongItem()">Cut</button>
    <button onclick="tempelItem()">Paste</button>
    <button onclick="unduhItem()">Download</button>
    <button onclick="hapusItem()">Delete</button>
  </div>
  <div id="breadcrumb">Silakan tambahkan akun untuk memulai</div>
  <div id="sortBar">
    Urutkan:
    <select id="sortField" onchange="applySort()">
      <option value="name">Nama</option>
      <option value="modifiedTime">Tanggal Diubah</option>
      <option value="size">Ukuran</option>
    </select>
    <button onclick="toggleSortOrder()">Naik/Turun</button>
  </div>
  <div id="fileGrid"></div>
</div>

<script>
const CLIENT_ID = "1023502925018-5g4u6p841036p64di1qbo2q0fd8mrou5.apps.googleusercontent.com";
const SCOPE = "https://www.googleapis.com/auth/drive";

let accounts = [];
let currentFolder = { accountEmail: null, id: "root" };
let clipboard = null;
let selectedItem = null;
let currentFiles = [];
let sortField = "name";
let sortAsc = true;

function tambahAkun() {
  const client = google.accounts.oauth2.initTokenClient({
    client_id: CLIENT_ID,
    scope: SCOPE,
    callback: async (resp) => {
      if (resp.error) { alert("Gagal login: " + resp.error); return; }
      const profile = await fetch("https://www.googleapis.com/drive/v3/about?fields=user,storageQuota", {
        headers: { Authorization: "Bearer " + resp.access_token }
      }).then(r => r.json());

      const existing = accounts.find(a => a.email === profile.user.emailAddress);
      if (existing) {
        existing.token = resp.access_token;
        existing.quota = profile.storageQuota;
      } else {
        accounts.push({ email: profile.user.emailAddress, token: resp.access_token, quota: profile.storageQuota });
      }
      renderAccounts();
      loadFolder(profile.user.emailAddress, "root");
    }
  });
  client.requestAccessToken();
}

function renderAccounts() {
  const list = document.getElementById("accountList");
  list.innerHTML = "";
  let totalLimit = 0, totalUsage = 0;

  accounts.forEach(acc => {
    totalLimit += Number(acc.quota.limit);
    totalUsage += Number(acc.quota.usage);
    const div = document.createElement("div");
    div.className = "account";
    div.innerText = acc.email;
    div.onclick = () => loadFolder(acc.email, "root");
    list.appendChild(div);
  });

  if (accounts.length === 0) return;
  const percent = (totalUsage / totalLimit) * 100;
  const kelas = percent < 70 ? "storage-safe" : percent < 90 ? "storage-warning" : "storage-danger";
  document.getElementById("storageSummary").innerHTML =
    `${percent.toFixed(1)}% terpakai<br>${(totalUsage/1024**3).toFixed(2)} GB dari ${(totalLimit/1024**3).toFixed(2)} GB
     <div class="storage-bar"><div class="storage-fill ${kelas}" style="width:${percent}%"></div></div>`;
}

async function refreshQuota(email) {
  const acc = accounts.find(a => a.email === email);
  const profile = await fetch("https://www.googleapis.com/drive/v3/about?fields=storageQuota", {
    headers: { Authorization: "Bearer " + acc.token }
  }).then(r => r.json());
  acc.quota = profile.storageQuota;
  renderAccounts();
}

function getToken(email) { return accounts.find(a => a.email === email).token; }

async function loadFolder(email, folderId) {
  currentFolder = { accountEmail: email, id: folderId };
  const token = getToken(email);
  const res = await fetch(
    `https://www.googleapis.com/drive/v3/files?q='${folderId}'+in+parents+and+trashed=false&fields=files(id,name,mimeType,modifiedTime,size)`,
    { headers: { Authorization: "Bearer " + token } }
  );
  const data = await res.json();
  currentFiles = data.files || [];
  document.getElementById("breadcrumb").innerText = email + " / " + (folderId === "root" ? "Root" : folderId);
  applySort();
}

function applySort() {
  sortField = document.getElementById("sortField").value;
  currentFiles.sort((a, b) => {
    let valA = a[sortField] || "", valB = b[sortField] || "";
    if (sortField === "size") { valA = Number(valA) || 0; valB = Number(valB) || 0; }
    return sortAsc ? (valA > valB ? 1 : -1) : (valA < valB ? 1 : -1);
  });
  renderTable(currentFiles, currentFolder.accountEmail);
}

function sortBy(field) { document.getElementById("sortField").value = field; toggleSortOrder(); }
function toggleSortOrder() { sortAsc = !sortAsc; applySort(); }

function formatTanggal(iso) {
  if (!iso) return "-";
  const d = new Date(iso);
  return d.toLocaleDateString("id-ID") + " " + d.toLocaleTimeString("id-ID", {hour: "2-digit", minute:"2-digit"});
}

function formatUkuran(bytes) {
  if (!bytes) return "-";
  const kb = bytes / 1024;
  if (kb < 1024) return kb.toFixed(1) + " KB";
  return (kb / 1024).toFixed(2) + " MB";
}

function renderTable(files, email) {
  const grid = document.getElementById("fileGrid");
  grid.innerHTML = `<table class="explorer">
    <tr><th onclick="sortBy('name')">Nama</th><th onclick="sortBy('modifiedTime')">Tanggal Diubah</th><th onclick="sortBy('size')">Ukuran</th></tr>
  </table>`;
  const table = grid.querySelector("table");
  files.forEach(f => {
    const isFolder = f.mimeType === "application/vnd.google-apps.folder";
    const row = document.createElement("tr");
    row.innerHTML = `<td>${isFolder ? "📁" : "📄"} ${f.name}</td><td>${formatTanggal(f.modifiedTime)}</td><td>${isFolder ? "-" : formatUkuran(f.size)}</td>`;
    row.onclick = () => {
      document.querySelectorAll("tr").forEach(r => r.classList.remove("selected"));
      row.classList.add("selected");
      selectedItem = { ...f, ownerEmail: email };
    };
    row.ondblclick = () => { if (isFolder) loadFolder(email, f.id); };
    table.appendChild(row);
  });
}

function buatFolder() {
  if (!currentFolder.accountEmail) { alert("Tambahkan akun terlebih dahulu."); return; }
  const name = prompt("Nama folder baru:");
  if (!name) return;
  fetch("https://www.googleapis.com/drive/v3/files", {
    method: "POST",
    headers: { Authorization: "Bearer " + getToken(currentFolder.accountEmail), "Content-Type": "application/json" },
    body: JSON.stringify({ name, mimeType: "application/vnd.google-apps.folder", parents: [currentFolder.id] })
  }).then(() => loadFolder(currentFolder.accountEmail, currentFolder.id));
}

function uploadFileTrigger() {
  if (!currentFolder.accountEmail) { alert("Tambahkan akun terlebih dahulu."); return; }
  document.getElementById("fileInput").click();
}

async function uploadFile(event) {
  const file = event.target.files[0];
  const metadata = { name: file.name, parents: [currentFolder.id] };
  const form = new FormData();
  form.append("metadata", new Blob([JSON.stringify(metadata)], { type: "application/json" }));
  form.append("file", file);
  await fetch("https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart", {
    method: "POST",
    headers: { Authorization: "Bearer " + getToken(currentFolder.accountEmail) },
    body: form
  });
  loadFolder(currentFolder.accountEmail, currentFolder.id);
  refreshQuota(currentFolder.accountEmail);
}

function salinItem() { if (selectedItem) clipboard = { mode: "copy", item: selectedItem }; else alert("Pilih berkas terlebih dahulu."); }
function potongItem() { if (selectedItem) clipboard = { mode: "cut", item: selectedItem }; else alert("Pilih berkas terlebih dahulu."); }

async function tempelItem() {
  if (!clipboard) { alert("Tidak ada berkas di clipboard."); return; }
  const src = clipboard.item;
  const sameAccount = src.ownerEmail === currentFolder.accountEmail;

  if (sameAccount) {
    if (clipboard.mode === "copy") {
      await fetch(`https://www.googleapis.com/drive/v3/files/${src.id}/copy`, {
        method: "POST",
        headers: { Authorization: "Bearer " + getToken(currentFolder.accountEmail), "Content-Type": "application/json" },
        body: JSON.stringify({ parents: [currentFolder.id] })
      });
    } else {
      await fetch(`https://www.googleapis.com/drive/v3/files/${src.id}?addParents=${currentFolder.id}`, {
        method: "PATCH",
        headers: { Authorization: "Bearer " + getToken(currentFolder.accountEmail) }
      });
    }
  } else {
    const downloadRes = await fetch(`https://www.googleapis.com/drive/v3/files/${src.id}?alt=media`, {
      headers: { Authorization: "Bearer " + getToken(src.ownerEmail) }
    });
    const blob = await downloadRes.blob();
    const form = new FormData();
    form.append("metadata", new Blob([JSON.stringify({ name: src.name, parents: [currentFolder.id] })], { type: "application/json" }));
    form.append("file", blob);
    await fetch("https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart", {
      method: "POST",
      headers: { Authorization: "Bearer " + getToken(currentFolder.accountEmail) },
      body: form
    });
    if (clipboard.mode === "cut") {
      await fetch(`https://www.googleapis.com/drive/v3/files/${src.id}`, {
        method: "DELETE",
        headers: { Authorization: "Bearer " + getToken(src.ownerEmail) }
      });
      refreshQuota(src.ownerEmail);
    }
  }
  clipboard = null;
  loadFolder(currentFolder.accountEmail, currentFolder.id);
  refreshQuota(currentFolder.accountEmail);
}

function hapusItem() {
  if (!selectedItem) { alert("Pilih berkas terlebih dahulu."); return; }
  if (!confirm("Hapus " + selectedItem.name + "?")) return;
  fetch(`https://www.googleapis.com/drive/v3/files/${selectedItem.id}`, {
    method: "DELETE",
    headers: { Authorization: "Bearer " + getToken(selectedItem.ownerEmail) }
  }).then(() => {
    loadFolder(currentFolder.accountEmail, currentFolder.id);
    refreshQuota(selectedItem.ownerEmail);
  });
}

async function unduhItem() {
  if (!selectedItem) { alert("Pilih berkas terlebih dahulu."); return; }
  const res = await fetch(`https://www.googleapis.com/drive/v3/files/${selectedItem.id}?alt=media`, {
    headers: { Authorization: "Bearer " + getToken(selectedItem.ownerEmail) }
  });
  const blob = await res.blob();
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = selectedItem.name;
  a.click();
}
</script>
</body>
</html>
